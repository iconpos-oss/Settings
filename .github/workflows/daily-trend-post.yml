name: Daily Blogger Trend Post

on:
  schedule:
    # 매일 KST 07:17 -> UTC 기준 22:17 (이전 날)
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, the job will not publish to Blogger (default true for safety)'
        required: false
        default: 'true'

jobs:
  post-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Secrets and variables/Actions/requirements.txt"

      - name: Run post_trends.py
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python "Secrets and variables/Actions/post_trends.py"
